    description: "Do not declare OnStateChanged or OnPausedChanged via DECLARE_DYNAMIC_MULTICAST_DELEGATE_*. Use the non-dynamic DECLARE_MULTICAST_DELEGATE_* variants (see adr-0007 Key Interfaces)."
    why: "Dynamic multicast requires UFUNCTION-marked handlers + reflection overhead + cannot bind lambdas. Wave Spawner R2a-2 + R3a FC-2 bind RSM->OnPausedChanged via AddLambda inside UWaveSpawnerSubsystem::Initialize() — dynamic delegates would reject this. If future Blueprint exposure is needed (designer-side debugging), author a parallel dynamic delegate (e.g. OnPausedChangedBP) rather than retrofitting the canonical one (GDD Rule 15 + 18)."
    adr: docs/architecture/adr-0007-run-state-machine-hosting.md
    added: 2026-06-25

  - pattern: RunStateMachine_Tick_set_bHasTickedThisFrame_without_prior_guard
    status: active
    description: "URunStateMachineSubsystem::Tick() MUST guard on bHasTickedThisFrame with early-return AS FIRST STATEMENT (after any thread check), then set bHasTickedThisFrame = true AS SECOND STATEMENT — before any body logic. Mirror of the existing ForceTickNow() guard-then-call-Tick pattern (see adr-0007 Implementation Guideline 5; Tick body skeleton lines 418–435 post-INT-005 amendment 2026-06-26)."
    why: "Without the guard, ForceTickNow() running first this frame would set the flag + execute the body, then the engine's later regular Tick() call would re-execute the body — double-advancing remaining_time + double-firing Rule 17 priority (death_confirmed). Risk 4 mitigation row explicitly promises this short-circuit behavior; the pre-INT-005 code at Tick() lines 418–425 set the flag but did not guard, contradicting the promise. Symmetric reverse case (engine ticks first, ForceTickNow short-circuits) is already covered by ForceTickNow()'s existing guard at lines 431–434 — this pattern enforces the symmetric guard at the engine-entry path."
    adr: docs/architecture/adr-0007-run-state-machine-hosting.md
    added: 2026-06-26

  - pattern: DPC_Controller_as_Subsystem_directly
    status: active
    description: "Do not make UDPCController itself a UGameInstanceSubsystem (skipping the UDPCSubsystem wrapper). The wrapper pattern is mandatory (see adr-0008 Structural Decision 1)."
    why: "DPC GDD R6 Rule 3 locks the controller's type at UObject + FTickableGameObject. Adopting a subsystem-only DPC would require a GDD revision via /propagate-design-change. The thin-wrapper pattern preserves GDD authority while providing canonical subsystem discovery."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_Subsystem_inherits_FTickableGameObject
    status: active
    description: "Do not have UDPCSubsystem inherit FTickableGameObject. The tick interface belongs ONLY to UDPCController (see adr-0008 Key Interfaces)."
    why: "If both the subsystem AND the controller implement FTickableGameObject, DPC ticks twice per frame. Engine Compatibility Verification 2 explicitly checks this. The subsystem is a static wrapper; only the controller ticks."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_Tick_admission_logic_outside_Tick_body
    status: active
    description: "All DPC admission/active-publication logic MUST live inside UDPCController::Tick() body. Do not move active-state logic into Initialize-driven event handlers, async tasks, or external callbacks (see adr-0008 Implementation Guideline 4)."
    why: "DPC GDD Rule 3 + Rule 14 bind the tick body order (SCOPE_CYCLE_COUNTER -> thread check -> ForceTickNow -> watchdog -> active gate -> curves -> snapshot -> broadcast). Moving logic out of Tick breaks the structural ordering guarantee with RSM."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_FApp_GetCurrentTime_usage
    status: active
    description: "Do not call FApp::GetCurrentTime() from DPC source. Use Tick()'s DeltaTime parameter for the watchdog accumulator (see adr-0008 Structural Decision 3)."
    why: "FApp::GetCurrentTime() is frame-cached and does not advance during lifecycle callbacks. Same prohibition as RSM (mirror of adr-0007 forbidden pattern). DPC's watchdog requires Tick-aligned DeltaTime per DPC GDD EC-13."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_FTimerManager_usage
    status: active
    description: "Do not use FTimerManager for any DPC timer (watchdog, phase transition, snapshot publication). All timing uses Tick()'s DeltaTime parameter or RSM accessors."
    why: "Same prohibition as RSM. DPC's watchdog timeout is computed inline in Tick. FTimerManager is incompatible with FakeTimeSource-based unit tests."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_curve_evaluation_without_finite_guards
    status: active
    description: "Do not evaluate UCurveFloat::GetFloatValue() returns without applying output-side finite guards via FMath::IsFinite (see adr-0008 Implementation Guideline 4 + DPC GDD Rule 8)."
    why: "FMath::Max(0.25f, NaN) returns NaN (NaN comparisons evaluate false in </>); FMath::FloorToInt32(NaN) is undefined behavior (implementation-defined on ARM, commonly produces INT_MIN). Without the guard, malformed curves silently corrupt FDPCFrameState."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_t_norm_input_without_clamp
    status: active
    description: "Do not pass t_norm to UCurveFloat::GetFloatValue() without first clamping via FMath::Clamp(t_norm, 0.0, 1.0) (see adr-0008 Implementation Guideline 4 + DPC GDD Rule 14)."
    why: "Non-finite or out-of-range t_norm input produces undefined curve output. The input-side clamp is the first guard; the output-side finite guard is the second. Both are required per DPC GDD Rule 8 + Rule 14."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_BroadcastFrameStatePublished_from_outside_controller
    status: active
    description: "Only UDPCController::Tick() may call UDPCSubsystem::BroadcastFrameStatePublished(). External callers (other subsystems, Blueprint, reflection workarounds) MUST NOT fire the broadcast directly (see adr-0008 Structural Decision 1)."
    why: "The friend declaration on UDPCSubsystem enforces this at compile time. Firing the broadcast from outside the controller decouples it from the snapshot write, producing inconsistent state visible to Wave Spawner / Pull-Wave."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: EDPCAbortReason_definition_in_RSM_module
    status: active
    description: "EDPCAbortReason MUST be defined in Public/DPC/DPCAbortReason.h inside the DPC module. RSM only forward-declares it. Do not move the definition to RSM module (see adr-0008 Structural Decision 4)."
    why: "DPC GDD R6 forward contract item 4 binds EDPCAbortReason ownership to DPC. Definition in RSM is an ownership inversion. Also: RequestAbort(EDPCAbortReason) MUST remain plain C++ (not UFUNCTION) while EDPCAbortReason is forward-declared."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_curve_validation_at_first_tick_or_lazy
    status: active
    description: "UCurveFloat asset validation MUST run at UDPCSubsystem::Initialize() — not at first Tick, not lazily at first GetFloatValue (see adr-0008 Structural Decision 2)."
    why: "Validation failure mid-gameplay is a worse failure mode for QA than fail-fast at startup. Lazy hot-path validation adds noise. TR-DPC-016 binding closed at Initialize-time validation."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: DPC_watchdog_accumulator_unclamped
    status: active
    description: "UDPCController watchdog accumulator MUST clamp DeltaTime via FMath::Min(DeltaTime, MAX_PER_TICK_DELTA_S = 0.1f) per tick. Do not accumulate raw DeltaTime (see adr-0008 Structural Decision 3)."
    why: "A debugger-resume single huge DeltaTime (e.g., 10.0s) would advance watchdog past the 5.0s timeout in one tick, skipping the intended Bound-and-Abort window. The 0.1s clamp ensures at least 50 ticks are required to reach timeout."
    adr: docs/architecture/adr-0008-dpc-subsystem-hosting.md
    added: 2026-06-26

  - pattern: PlayerMovement_SetActorRotation_for_lean
    status: active
    description: "UPlayerLaneMovementComponent MUST NOT call AActor::SetActorRotation (or any variant that rotates the pawn root) to apply body/head/arm lean. Lean is applied to the MESH component's local transform via MeshComponent->SetRelativeRotation(...). Root remains at identity rotation. See ADR-0009 Structural Decision 5 + Implementation Guideline 6."
    why: "Rotating the pawn root rotates the collision geometry with it — the committed lane X (a world-space X coordinate set via SetActorLocation on SETTLED→SLIPPING) would rotate out of the target lane's world position on the next tick, breaking mechanics Rule 2 collision commitment. Collision geometry MUST stay aligned to the track-X axis; only the visual mesh rotates for lean. Mechanics §3 Cross-Component Interfaces → Rotation Implementation is explicit on this: 'Use SetRelativeRotation on the skeletal/voxel mesh component (or lean socket). Do NOT use SetActorRotation for lean — it rotates the root actor, which moves the collision capsule with it and breaks the collision-commitment contract.'"
    adr: docs/architecture/adr-0009-player-movement-hosting.md
    added: 2026-07-03

  - pattern: PlayerMovement_TickComponent_without_prior_ForceTickNow
    status: active
    description: "UPlayerLaneMovementComponent::TickComponent body MUST call RSMSubsystem->ForceTickNow() as its first statement after check(IsInGameThread()). Do not delay the call, do not gate it on movement_state, do not skip it under any RSM state. Mirrors the ADR-0008 pattern for UDPCController::Tick (which places RSM->ForceTickNow() as its first non-instrumentation statement). See ADR-0009 Structural Decision 4 + Implementation Guideline 1."
    why: "Without the ForceTickNow prologue, PM reads stale RSM.current_state / RSM.remaining_time — up to one frame stale under unfavorable engine tick scheduling (UE 5.7 does not guarantee an ordering between UActorComponent::TickComponent on the player pawn and URunStateMachineSubsystem::Tick as an FTickableGameObject on a UGameInstanceSubsystem — AddTickPrerequisiteComponent is not available for subsystem targets per platform §3 Tick Ordering). F-2's effective_slip_tween clamp check + F-6 timer advance both silently corrupt against stale RSM state. RSM's bHasTickedThisFrame guard (INT-005-amended 2026-06-26) makes ForceTickNow idempotent within-frame — the call is safe even if DPC or engine already ticked RSM this frame; PM's call short-circuits under the idempotence guard. The canonical (c) pull-primitive pattern supersedes platform §3 lines 57–64 pre-ADR-0007 options (a) one-frame-lag + (b) manual TickComponent from RSM."
    adr: docs/architecture/adr-0009-player-movement-hosting.md
    added: 2026-07-03
