  - name: MAX_PULLS_PER_BARRAGE
    status: provisional
    source: design/gdd/difficulty-phase-controller.md
    referenced_by:
      - design/gdd/difficulty-phase-controller.md
      - design/gdd/pull-wave-behavior.md
    value: 3
    unit: pulls (count)
    notes: >
      Maximum number of telegraph onset events within a single barrage pattern
      (patterns flagged is_barrage=true in the PEAK pool). Equals max_concurrent_waves
      PEAK target (R3-locked = 3) — a barrage exhausts the PEAK concurrency cap exactly.
      Value is PROVISIONAL pending DPC AC-PILLAR-2-BARRAGE close at the prototype
      milestone. Resolution paths: Path A (pass) locks M=3; Path C (systemic fail)
      revises M downward (e.g., 2) with CD sign-off and re-binding of Player Fantasy +
      Phase Identity. Cluster B's max_concurrent_waves enforcement semantic must not
      skip-and-drop pulls within a single barrage pattern — if skip-and-drop is chosen,
      AC-PILLAR-2-BARRAGE will fail and M must be revisited before Alpha.
      Sourced from DPC GDD Phase Identity + Pillar Alignment Under Option B sections.
    added: 2026-06-05
    revised: ""

  - name: BARRAGE_SIMULTANEITY_WINDOW_S
    status: provisional
    source: design/gdd/difficulty-phase-controller.md
    referenced_by:
      - design/gdd/difficulty-phase-controller.md
      - design/gdd/pull-wave-behavior.md
      - design/gdd/wave-spawner-pattern-library.md  # added 2026-06-23 per Wave Spawner R3a /propagate-design-change closure (qa-lead R3 cross-system verification finding); Wave Spawner Rule 6 + Rule 15 BARRAGE_W_SPAN cook check + F-5 simultaneity span check + F-7 FLOOR/W ratio contract all consume this constant
    value: 0.35
    unit: seconds
    notes: >
      Maximum time span within which up to MAX_PULLS_PER_BARRAGE telegraph onsets
      may cluster in a barrage pattern. Designed as TELEGRAPH_WINDOW_FLOOR_S / 2 —
      this ratio is what makes barrage onset timing perceptually distinct from
      staggered-at-floor non-barrage patterns; W near TELEGRAPH_WINDOW_FLOOR_S
      collapses barrage identity. Value is PROVISIONAL pending DPC AC-PILLAR-2-BARRAGE
      close at the prototype milestone.

      R2 Cluster E (2026-06-08) raised TELEGRAPH_WINDOW_FLOOR_S to 0.65s under
      path (b); under the FLOOR/2 ratio that implied W = 0.325s. That value was
      deferred pending DPC author confirmation.

      2026-06-11 (PM R9 cross-system coordination): Option (c) bound; FLOOR
      held at 0.65s; derivation target was 0.325s; current value 0.3 was left
      in place pending DPC R7+ revision.

      2026-06-17/18 (Pull-Wave R10d FLOOR raise + R11a-arithmetic propagation):
