  - name: LeanEaseCurve_Canonical
    status: active
    source: design/gdd/pull-wave-behavior.md
    referenced_by:
      - design/gdd/pull-wave-behavior.md
    value: "Content/Game/PullWave/Curves/LeanEaseCurve_Canonical.uasset"
    unit: asset path (UCurveFloat)
    notes: >
      Canonical ease-in-out curve asset driving BOTH wave-mass rotation
      (lean_angle_deg = lean_progress × LEAN_ANGLE_DEG_BY_TIER[tier]) AND
      brightness ramp (LeanChargeIntensity_scalar = 1.0 + EaseCurve(lean_progress)
      × (LEAN_BRIGHTNESS_PEAK_RATIO - 1.0)). The single shared curve guarantees
      brightness and rotation are always in-phase (Pillar 2 windup-before-punch
      ordering — R2 Cluster F binding).

      Control points (registry-locked, NOT design intent guidance):
      0.0 → 0.0, 0.4 → 0.15, 0.7 → 0.7, 1.0 → 1.0.

      Interpolation mode (R10b — pinned 2026-06-16 per R9 systems-designer F1;
      was implicit in fingerprint targets, now binding metadata): every
      FRichCurveKey on the canonical asset MUST have
        InterpMode  = RCIM_Cubic
        TangentMode = RCTM_Auto
      This is the UE UCurveFloat editor default — the pin makes it explicit
      and cook-time-verifiable. Linear interpolation would silently change
      the fingerprint values at intermediate t (e.g., linear between
      (0.0, 0.0) and (0.4, 0.15) yields 0.094 at t=0.25, contradicting the
      0.038 fingerprint target) and would shift the EC-EASE-CURVE-ONSET-DELAY
      perceptibility-onset arithmetic by ~30ms — the survivability invariant
      math depends on the cubic curve's t_perceptible_direction ≈ 0.13–0.15s
      figure, which is unique to cubic Hermite + auto tangents on these
      control points.

      Cook-time fingerprint check (R7 B7 — NEW; extended R10b 2026-06-16):
      Wave Spawner authoring tooling validates the canonical asset at admission
      via TWO checks:
        (1) Control-point sample check: sample at five reference t values and
            assert return values within CURVE_ENDPOINT_TOLERANCE=0.005 of the
            registry-locked targets:
              t=0.0  → expected 0.0;   tolerance 0.005
              t=0.25 → expected ~0.038 (interpolated; tolerance 0.005)
              t=0.4  → expected 0.15;  tolerance 0.005
              t=0.7  → expected 0.7;   tolerance 0.005
              t=1.0  → expected 1.0;   tolerance 0.005
        (2) Interpolation-metadata check (R10b — NEW): iterate the asset's
            FRichCurve key array and assert each key's InterpMode == RCIM_Cubic
            AND TangentMode == RCTM_Auto. Any other combination halts admission
            with an error citing R9 systems-designer F1.
      The two-check fingerprint is the long-stop against substitution of a
      standard cubic ease-in-out preset (which returns ~0.10 at t=0.4 — check
      (1) catches it) OR a linear-interpolated variant on the same control
      points (which returns 0.094 at t=0.25 — check (1) ALSO catches it; check
      (2) catches it pre-evaluation as defense-in-depth and as a clearer error
      message for the authoring tooling user).

      Source-code enforcement: AC-PW-22b pattern 12 (R7 B7 — NEW) FORBIDs
      inlined `UCurveFloat*` direct-load construction in the rotation-driver
      source path; the canonical curve MUST be loaded by registry name.

      Material-dependency note: if the LeanChargeIntensity formula or the
      LEAN_BRIGHTNESS_PEAK_RATIO floor are revised, this curve's control
      points may need re-validation against the new phase-alignment math.

      (Added 2026-06-10 R7 B7 per art-director R6 RECOMMENDED escalated to
      BLOCKING at R7; closes the unverifiable-curve-asset class that R6
      left unaddressed. Revised 2026-06-16 R10b measurement sub-pass per
      R9 systems-designer F1: interpolation_mode = RCIM_Cubic and
      tangent_mode = RCTM_Auto pinned as binding metadata; cook-time
      fingerprint check extended to verify these on every FRichCurveKey.
      Closes the systems-designer F1 finding that EC-EASE-CURVE-ONSET-DELAY
