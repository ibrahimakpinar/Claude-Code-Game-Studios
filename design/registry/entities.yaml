      for the empirical-confirmation phase (two-phase gate: ADVISORY at
      story-Done via static arithmetic; BLOCKING at Alpha via
      AC-PILLAR-2-CONCURRENT prototype playtest).

      2026-06-17 (Pull-Wave R10d cross-system resolution — CD PATH (i)
      ruling) — value raised 0.65s → 0.70s via creative-director PATH (i)
      trade-off ruling to close Pull-Wave F-BARRAGE-SURVIVABILITY-INVARIANT
