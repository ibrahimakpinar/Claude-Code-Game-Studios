      2026-06-19 (/propagate-design-change post-R14): RESOLVED. Value flipped
      0.3 → 0.35s per user decision restoring the FLOOR/2 design ratio at
      new FLOOR=0.70s. Hold-condition "DPC R-Updated re-review confirmation"
      satisfied by R14 APPROVED-on-first-pass 2026-06-19 (Pull-Wave + DPC both
      TERMINAL; R7→R14 trajectory closed). Lock-step oracle-site updates
      applied per ADR-0004 dual-grep methodology at: DPC §AC-PILLAR-2-BARRAGE
      Path A (line 944) `BARRAGE_SIMULTANEITY_WINDOW_S = 0.3s` → `0.35s`;
      Pull-Wave EC-CONCURRENT-LANDING-ON-SAME-LANE (line 535) `W = 0.3s` →
      `W = 0.35s`. Cross-system survivability invariant UNAFFECTED — W is
      the simultaneity window (max time span across M onsets), not the escape
