      - design/gdd/player-movement-platform.md  # Step 8a routing 2026-07-02 — TELEGRAPH_WINDOW_FLOOR_S is consumed by PM Hardware Contract (F-BARRAGE-SURVIVABILITY-INVARIANT-CORNERS derivation matrix); Hardware Contract lives in platform sub-GDD per PM decomposition mini-map
