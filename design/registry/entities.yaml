  - name: LEAN_BRIGHTNESS_PEAK_RATIO
    status: provisional
    source: design/gdd/pull-wave-behavior.md
    referenced_by:
      - design/gdd/pull-wave-behavior.md
    value: 1.8
    unit: ratio (dimensionless)
    notes: >
      Peak brightness multiplier on the wave-mass specular highlight band at
      lean_progress=1.0, applied via the `LeanChargeIntensity` material scalar
      routed through PerInstanceCustomData[0]. Base brightness (lean_progress=0.0)
      = 1.0×; peak (lean_progress=1.0) = 1.8×. Driven by EaseCurve(lean_progress),
      not raw lean_progress, to keep brightness phase aligned with rotation phase
      (Pillar 2 windup→punch ordering — see Pull-Wave GDD R2 Cluster F binding).
      Uniform across ALL 5 lean_magnitude_tier values (R4 RC-R3-2 — extended
      from 4 to include tier-0). Brightness carries PHASE only; the angle
      channel carries MAGNITUDE. Channel-separation rationale (R3 CD adjudication
      #2): driving brightness from magnitude would create dual-coding (player
      reads both intensity AND angle to determine destination) and would make
      tier-0 visually mute during LEANING, degrading the read-and-react loop.
      Tier-0 (zero rotation) therefore still ramps brightness 1.0× → 1.8× via
      the eased curve, communicating "wave is approaching on this lane" in the
      time dimension. Implementation MUST read this from the registry (or a
      control-manifest constant), never hardcode 1.8 inline in shader code or
      game code (per technical-preferences.md data-driven rule).
      Safe range [1.7, 2.2] (R6 B3 — floor raised 1.5 → 1.7 against dark
      iron-gray base palette RGB 55-65 / 50-60 / 45-55): at 1.5× peak on the
      current dark base, the lit-face lift is ~28 RGB points — below reliable
      non-foveal perception threshold at 6-inch mobile viewing distance. At
      1.7× peak the lift is ~42 RGB points, comfortably above threshold. Above
      2.2 begins to wash out voxel material detail. Material-dependency note:
      this floor is conditional on the art-bible-locked base palette staying
      in the RGB ~60 average band. If art bible raises base luminance to RGB
      ≥100, the 1.7 floor may be re-evaluated downward against the new palette;
      if art bible darkens the base further, the floor must rise above 1.7×.
      (Added 2026-06-08 R2 Cluster F per advisor recommendation; tier-0 inclusion
      + channel-separation rationale clarified R4 RC-R3-2 + RC-R3-6 2026-06-08;
      safe-range floor raised R6 B3 2026-06-10 against dark iron-gray base.)
    added: 2026-06-08
    revised: 2026-06-10

  - name: NEAR_MISS_FLASH_DURATION_S
    status: active
    source: design/gdd/pull-wave-behavior.md
    referenced_by:
      - design/gdd/pull-wave-behavior.md
    value: 0.066
    unit: seconds
    notes: >
      Duration of the wave-side near-miss chromatic edge flash on the
      source-lane-facing voxel faces (Pull-Wave Visual section). TIME-BASED,
      not frame-count — the prior R3 2-frame spec collapsed to 16ms at 120Hz
      (below the 50–80ms reliable conscious-perception threshold for a
      peripheral chromatic event). 0.066s = ≈4 frames @ 60Hz / ≈2 @ 30Hz / ≈8 @
      120Hz; sits at the threshold floor at any frame rate.

      Implementation: NearMissEdgeFlash material scalar routed through
      PerInstanceCustomData[1], driven by a frame-rate-independent time
      accumulator (flash_elapsed_s += DeltaTime; intensity =
      max(0, 1.0 − flash_elapsed_s / NEAR_MISS_FLASH_DURATION_S)). Composites
      independently of PM's Y-dip; remains in the batched ISMC draw call.

      Safe range [0.050, 0.120] seconds: lower bound is the conscious-perception
      floor; upper bound prevents the flash from outliving the LANDED hold
      (WAVE_DESPAWN_HOLD_S = 0.15s default; raising the flash past the hold
      duration truncates the flash on DESPAWNING). Knob-interaction note: if
      WAVE_DESPAWN_HOLD_S is ever tightened below NEAR_MISS_FLASH_DURATION_S,
      the flash is truncated — surface as cross-knob review trigger.
      (Added 2026-06-08 R4 RC-R3-6 per R3 3-way convergence finding; replaces
      the frame-count-based 2-frame spec.)
    added: 2026-06-08
    revised: ""

  - name: REACTION_BUDGET
    status: provisional
    source: design/gdd/pull-wave-behavior.md
    referenced_by:
      - design/gdd/pull-wave-behavior.md
    value: 0.20
    unit: seconds
    notes: >
      Mobile recognition floor: time consumed between telegraph-read and first
      slip-initiation on a 6-inch capacitive touch screen. Decomposes as:
      visual acquisition (~0.07s) + parse + decision (~0.08s) + motor initiation
      (~0.05s). Additive term in F-BARRAGE-SURVIVABILITY-INVARIANT (Pull-Wave)
      alongside SLIP_TWEEN × MIN_ESCAPE_SLIPS.

      Provisional pending playtest evidence. Safe range [0.20, 0.25] seconds:
      lower bound is the empirical mobile recognition floor — reducing below
      0.20s requires platform-specific evidence that SLIPSTORM's pre-telegraphed
      pattern structure reduces acquisition latency AND CD sign-off on the Player
      Fantasy survivability promise. Upper bound (0.25s) covers degraded-attention
      scenarios; raising past 0.20s forces TELEGRAPH_WINDOW_FLOOR_S raise.

      At current PM R9 Option (c)-resolved defaults (SLIP_TWEEN = 0.15s,
      MIN_ESCAPE_SLIPS = 2, TELEGRAPH_FLOOR = 0.65s): 0.15 × 2 + 0.20 = 0.50
      ≤ 0.65 → 150ms margin at REACT default; 0.15 × 2 + 0.25 = 0.55 ≤ 0.65
      → 100ms margin at REACT safe-range ceiling. Invariant holds with ≥6
      frame margin at 60fps minimum across the full REACT safe range — Pillar
      5 ("no deaths attributable to latency / device") survivability promise
      preserved without degraded-attention carve-out. See PM R9 cross-system
      coordination resolution at
      design/gdd/reviews/cross-system-survivability-coordination-2026-06-11.md.
      Cannot be revised without re-verifying F-BARRAGE-SURVIVABILITY-INVARIANT.
    added: 2026-06-08
    revised: "2026-06-11"

