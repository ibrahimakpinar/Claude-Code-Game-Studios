    revised: "2026-06-18"

  - name: BARRAGE_EVENTS_PER_PEAK_MIN
    status: active
    source: design/gdd/difficulty-phase-controller.md
    referenced_by:
      - design/gdd/difficulty-phase-controller.md
    value: 1
    unit: barrage events per PEAK window (count)
    notes: >
      Minimum barrage events per PEAK run window. Identity-layer floor: N < 1 in any
      PEAK window means the phase's exclusive identity moment (barrage) is unobservable
      that run, which violates the Phase Identity section. This floor is LOCKED —
      revising it requires reopening Phase Identity and Player Fantasy under CD sign-off.
      Wave Spawner's pattern selection rule MUST structurally guarantee ≥1 barrage per
      PEAK (a purely probabilistic selection rule can produce N=0 runs and is non-compliant).
      Sourced from DPC GDD Phase Identity section.
    added: 2026-06-05
    revised: ""

  - name: BARRAGE_EVENTS_PER_PEAK_MAX
    status: active
    source: design/gdd/difficulty-phase-controller.md
    referenced_by:
      - design/gdd/difficulty-phase-controller.md
    value: 3
    unit: barrage events per PEAK window (count)
    notes: >
      Maximum barrage events per PEAK run window. Identity-layer ceiling: above N=3
      in a 15-second PEAK (at default RUN_DURATION_S=60s), barrages cease to be
      climax moments and read as steady-state barrage, collapsing the contrast that
      makes barrage feel like a "commit." Estimated ~7-10 pattern starts per PEAK
      at default settings; N_max=3 represents ~30-43% barrage frequency, which keeps
      barrage as a moment, not a steady state. This ceiling is LOCKED — revising it
      requires reopening Phase Identity and Player Fantasy under CD sign-off.
      Sourced from DPC GDD Phase Identity section.
    added: 2026-06-05
    revised: ""

  - name: BARRAGE_EVENTS_PER_PEAK_TARGET_AVG
    status: active
    source: design/gdd/difficulty-phase-controller.md
    referenced_by:
      - design/gdd/difficulty-phase-controller.md
    value: 2
    unit: barrage events per PEAK window (count, average over run sample)
    notes: >
      Target average barrage events per PEAK window across a session of runs.
      Calibrated between MIN (1) and MAX (3) to provide consistent climax-beat
      frequency without over-exposing the barrage pattern. Identity-layer target.
      Wave Spawner's selection mechanism should approximate this average over a
      rolling window of runs (not enforce it per-run — per-run variation between
      MIN and MAX is acceptable and desirable for run diversity). LOCKED —
      revising requires CD sign-off on Player Fantasy.
      Sourced from DPC GDD Phase Identity section.
    added: 2026-06-05
    revised: ""

