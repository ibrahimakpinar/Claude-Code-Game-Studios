      the FLOOR/2 design intent the new derivation target is W = 0.35s
      (= 0.70 / 2). The R2 Cluster E 0.325s target is retired; the rejected
      R8-era 0.34s derivation (Option (b)) remains withdrawn. Current value
      0.3 was left in place until DPC author confirms 0.3 vs 0.35s at next
