      /propagate-design-change 2026-06-19): Constraint A binds OPENER_key under
      Path B at FLOOR + 0.24s ≤ 1.0s (where 1.0s is the practical "generous-but-
      not-lethargic" perceptibility ceiling for telegraph windows). Solving:
