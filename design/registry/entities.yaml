      (c) Tooling — registry-driven validation can flag any GDD or test fixture
          asserting FLOOR > 0.76s as out-of-band.

      Status: derived (not primary tunable; computed from Constraint A + Path B
      OPENER offset). NOT subject to FLOOR/2 design ratio (that's
